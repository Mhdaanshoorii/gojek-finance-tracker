  </button>

<script>

/* =====================================================
   DATA
===================================================== */

let transactions =
  JSON.parse(
    localStorage.getItem("gojekTransactions") || "[]"
  );

let scannedData = [];


/* =====================================================
   RUPIAH
===================================================== */

function rupiah(n){

  return new Intl.NumberFormat(
    "id-ID",
    {
      style:"currency",
      currency:"IDR",
      maximumFractionDigits:0
    }
  ).format(Number(n));

}


/* =====================================================
   STORAGE
===================================================== */

function saveData(){

  localStorage.setItem(
    "gojekTransactions",
    JSON.stringify(transactions)
  );

}


/* =====================================================
   DASHBOARD
===================================================== */

function updateDashboard(){

  let income = 0;
  let expense = 0;

  transactions.forEach(t => {

    if(t.type === "income"){
      income += Number(t.amount);
    }

    if(t.type === "expense"){
      expense += Number(t.amount);
    }

  });

  document.getElementById("totalIncome")
    .textContent = rupiah(income);

  document.getElementById("totalExpense")
    .textContent = rupiah(expense);

  document.getElementById("totalNet")
    .textContent = rupiah(income - expense);

}


/* =====================================================
   RENDER TRANSACTIONS
===================================================== */

function renderTransactions(){

  const box =
    document.getElementById("transactions");

  if(transactions.length === 0){

    box.innerHTML =
      '<div class="empty">Belum ada transaksi</div>';

    updateDashboard();

    return;
  }

  box.innerHTML = "";

  [...transactions]
    .reverse()
    .forEach(t => {

      const div =
        document.createElement("div");

      div.className =
        "transaction";

      const income =
        t.type === "income";

      const arrow =
        income ? "⬆️" : "⬇️";

      let info = "";

      if(t.source === "gojek"){

        let jam = t.time || "-";

        if(t.endTime){

          jam +=
            "–" +
            t.endTime;

        }

        info =
          "Gojek · " +
          jam +
          " · " +
          (t.distance || "-") +
          " km · " +
          (t.payment || "-");

      }else{

        info =
          t.note || "Manual";

      }

      div.innerHTML = `

        <div class="t-title ${income ? "income":"expense"}">

          ${arrow}
          ${rupiah(t.amount)}

        </div>

        <div class="t-info">
          ${info}
        </div>

        <div class="t-date">
          ${t.date || "-"}
        </div>

      `;

      box.appendChild(div);

    });

  updateDashboard();

}


/* =====================================================
   TODAY
===================================================== */

function getToday(){

  const d = new Date();

  return (
    String(d.getDate()).padStart(2,"0") +
    "/" +
    String(d.getMonth()+1).padStart(2,"0") +
    "/" +
    d.getFullYear()
  );

}


/* =====================================================
   IMAGE PREPARE
===================================================== */

function prepareImage(file){

  return new Promise((resolve,reject)=>{

    const img =
      new Image();

    const url =
      URL.createObjectURL(file);

    img.onload = function(){

      const scale = 2;

      const canvas =
        document.createElement("canvas");

      canvas.width =
        img.width * scale;

      canvas.height =
        img.height * scale;

      const ctx =
        canvas.getContext("2d");

      ctx.drawImage(
        img,
        0,
        0,
        canvas.width,
        canvas.height
      );


      const data =
        ctx.getImageData(
          0,
          0,
          canvas.width,
          canvas.height
        );


      for(
        let i=0;
        i<data.data.length;
        i+=4
      ){

        const r =
          data.data[i];

        const g =
          data.data[i+1];

        const b =
          data.data[i+2];

        const gray =
          0.299*r +
          0.587*g +
          0.114*b;

        data.data[i] =
          gray;

        data.data[i+1] =
          gray;

        data.data[i+2] =
          gray;

      }


      ctx.putImageData(
        data,
        0,
        0
      );


      URL.revokeObjectURL(url);

      resolve(canvas);

    };

    img.onerror = reject;

    img.src = url;

  });

}


/* =====================================================
   NORMALIZE OCR
===================================================== */

function normalizeOCR(text){

  return String(text || "")
    .replace(/[“”"]/g,"")
    .replace(/[|]/g,"")
    .trim();

}


/* =====================================================
   AMOUNT
===================================================== */

function parseAmount(text){

  let s =
    normalizeOCR(text)
      .replace(/O/gi,"0")
      .replace(/[Il]/g,"1");


  const match =
    s.match(
      /R[Pp]?\s*([0-9][0-9.,]*)/i
    );


  if(!match){
    return null;
  }


  let digits =
    match[1]
      .replace(/[^\d]/g,"");


  if(!digits){
    return null;
  }


  const amount =
    Number(digits);


  if(
    amount < 1000 ||
    amount > 1000000
  ){

    return null;

  }


  return amount;

}


/* =====================================================
   TIME EXTRACTION
===================================================== */

/*
  V5 KUNCI:

  Bisa membaca:

  12:20
  12.20
  12:20-12:53
  12:20–12:53
  12:20 - 12:53
*/

function extractTimes(text){

  let s =
    normalizeOCR(text)
      .replace(/[Oo]/g,"0")
      .replace(/[Il]/g,"1")
      .replace(/;/g,":");


  const found = [];


  const regex =
    /([01]?\d|2[0-3])\s*[:.]\s*([0-5]\d)/g;


  let m;


  while(
    (m = regex.exec(s)) !== null
  ){

    const hour =
      Number(m[1]);

    const minute =
      m[2];


    found.push(
      String(hour).padStart(2,"0") +
      ":" +
      minute
    );

  }


  return found;

}


/* =====================================================
   DISTANCE
===================================================== */

function parseDistance(text){

  let s =
    normalizeOCR(text)
      .replace(",",".")
      .replace(/[Oo]/g,"0");


  const m =
    s.match(
      /(?:^|\s)([0-9]+(?:\.[0-9]+)?)(?:\s*)$/ 
    );


  if(!m){
    return null;
  }


  const n =
    parseFloat(m[1]);


  if(
    n < 0.1 ||
    n > 100
  ){

    return null;

  }


  return n.toFixed(2);

}


/* =====================================================
   PAYMENT
===================================================== */

function parsePayment(text){

  const s =
    normalizeOCR(text)
      .toLowerCase();


  if(
    s.includes("gopay") ||
    s.includes("gopav")
  ){

    return "GoPay";

  }


  if(
    s.includes("tunai") ||
    s.includes("cash")
  ){

    return "Tunai";

  }


  return null;

}


/* =====================================================
   GET OCR WORDS
===================================================== */

function buildWords(result){

  const words =
    result.data.words || [];


  return words
    .filter(w =>
      w.text &&
      w.text.trim() &&
      w.confidence >= 20
    )
    .map(w => {

      const text =
        normalizeOCR(w.text);


      return {

        text:text,

        x0:w.bbox.x0,
        y0:w.bbox.y0,
        x1:w.bbox.x1,
        y1:w.bbox.y1,

        cx:
          (w.bbox.x0+w.bbox.x1)/2,

        cy:
          (w.bbox.y0+w.bbox.y1)/2

      };

    });

}


/* =====================================================
   TIME CANDIDATES
===================================================== */

function getTimeCandidates(words){

  const result = [];


  words.forEach(w => {

    const times =
      extractTimes(w.text);


    times.forEach(t => {

      result.push({

        value:t,

        x:w.cx,

        y:w.cy,

        word:w.text

      });

    });

  });


  return result;

}


/* =====================================================
   DISTANCE CANDIDATES
===================================================== */

function getDistanceCandidates(words){

  const result = [];


  words.forEach(w => {

    const d =
      parseDistance(w.text);


    if(d){

      result.push({

        value:d,

        x:w.cx,

        y:w.cy

      });

    }

  });


  return result;

}


/* =====================================================
   PAYMENT CANDIDATES
===================================================== */

function getPaymentCandidates(words){

  const result = [];


  words.forEach(w => {

    const p =
      parsePayment(w.text);


    if(p){

      result.push({

        value:p,

        x:w.cx,

        y:w.cy

      });

    }

  });


  return result;

}


/* =====================================================
   FIND TIMES FOR AMOUNT
===================================================== */

function findTimesForAmount(
  amount,
  times
){

  /*
    Hanya ambil jam yang:

    1. berada di area vertikal
       transaksi tersebut

    2. berada di sebelah kanan nominal

    3. tidak terlalu jauh
  */

  const candidates =
    times.filter(t => {

      const vertical =
        Math.abs(t.y - amount.y);

      const horizontal =
        t.x - amount.x;


      return (
        vertical < 110 &&
        horizontal > -30 &&
        horizontal < 1000
      );

    });


  candidates.sort((a,b) => {

    /*
      Prioritas utama:
      semakin dekat secara vertikal.

      Jika sama:
      semakin dekat secara horizontal.
    */

    const sa =
      Math.abs(a.y-amount.y)*5 +
      Math.abs(a.x-amount.x);

    const sb =
      Math.abs(b.y-amount.y)*5 +
      Math.abs(b.x-amount.x);

    return sa-sb;

  });


  /*
    Buang jam yang sama.
  */

  const unique = [];


  candidates.forEach(t => {

    if(
      !unique.some(
        x => x.value === t.value
      )
    ){

      unique.push(t);

    }

  });


  /*
    Biasanya kita membutuhkan
    maksimal dua jam.
  */

  return unique.slice(0,2);

}


/* =====================================================
   PARSE BY POSITION V5
===================================================== */

function parseByPositionV5(words){

  const amounts = [];


  words.forEach(w => {

    const amount =
      parseAmount(w.text);


    if(amount){

      amounts.push({

        amount:amount,

        x:w.cx,

        y:w.cy,

        x0:w.x0,
        y0:w.y0,
        x1:w.x1,
        y1:w.y1

      });

    }

  });


  /*
    Hindari nominal yang jelas merupakan
    angka bukan transaksi.
  */

  const uniqueAmounts = [];


  amounts.forEach(a => {

    const duplicate =
      uniqueAmounts.some(
        x =>
          x.amount === a.amount &&
          Math.abs(x.y-a.y) < 15
      );


    if(!duplicate){

      uniqueAmounts.push(a);

    }

  });


  const times =
    getTimeCandidates(words);


  const distances =
    getDistanceCandidates(words);


  const payments =
    getPaymentCandidates(words);


  const results = [];


  uniqueAmounts.forEach(a => {

    const selectedTimes =
      findTimesForAmount(
        a,
        times
      );


    /*
      Cari jarak dalam area
      transaksi yang sama.
    */

    const distanceCandidates =
      distances
        .filter(d =>
          Math.abs(d.y-a.y) < 180
        )
        .sort(
          (x,y) =>
            Math.abs(x.y-a.y) -
            Math.abs(y.y-a.y)
        );


    /*
      Cari payment.
    */

    const paymentCandidates =
      payments
        .filter(p =>
          Math.abs(p.y-a.y) < 220
        )
        .sort(
          (x,y) =>
            Math.abs(x.y-a.y) -
            Math.abs(y.y-a.y)
        );


    results.push({

      type:"income",

      amount:a.amount,

      source:"gojek",

      time:
        selectedTimes[0]
          ? selectedTimes[0].value
          : "",

      endTime:
        selectedTimes[1]
          ? selectedTimes[1].value
          : "",

      distance:
        distanceCandidates[0]
          ? distanceCandidates[0].value
          : "",

      payment:
        paymentCandidates[0]
          ? paymentCandidates[0].value
          : "",

      date:getToday(),

      y:a.y

    });

  });


  /*
    Urut sesuai posisi screenshot.
  */

  results.sort(
    (a,b) =>
      a.y-b.y
  );


  /*
    Filter transaksi masuk akal.
  */

  scannedData =
    results.filter(
      r =>
        r.amount >= 1000 &&
        r.amount <= 1000000
    );


  return scannedData;

}


/* =====================================================
   SCAN
===================================================== */

async function scanImage(){

  const input =
    document.getElementById(
      "imageInput"
    );


  const progress =
    document.getElementById(
      "progress"
    );


  if(
    !input.files ||
    !input.files[0]
  ){

    alert(
      "Pilih screenshot Gojek dulu."
    );

    return;

  }


  try{

    progress.innerHTML =
      "🖼️ Menyiapkan gambar...";


    const canvas =
      await prepareImage(
        input.files[0]
      );


    progress.innerHTML =
      "⏳ OCR sedang membaca...";


    const result =
      await Tesseract.recognize(
        canvas,
        "eng",
        {

          logger:function(m){

            if(
              m.status ===
              "recognizing text"
            ){

              progress.innerHTML =
                "⏳ Membaca " +
                Math.round(
                  m.progress*100
                ) +
                "%...";

            }

          }

        }
      );


    const words =
      buildWords(result);


    console.log(
      "V5 OCR WORDS",
      words
    );


    parseByPositionV5(
      words
    );


    if(
      scannedData.length === 0
    ){

      progress.innerHTML =
        "❌ Transaksi tidak ditemukan.";

      alert(
        "Nominal Gojek tidak ditemukan.\n\n" +
        "Coba gunakan screenshot yang lebih jelas."
      );

      return;

    }


    showReview();


    progress.innerHTML =
      "✅ " +
      scannedData.length +
      " transaksi ditemukan.";

  }
  catch(error){

    console.error(error);

    progress.innerHTML =
      "❌ OCR gagal.";

    alert(
      "OCR gagal membaca screenshot."
    );

  }

}


/* =====================================================
   REVIEW
===================================================== */

function showReview(){

  const review =
    document.getElementById(
      "review"
    );


  const list =
    document.getElementById(
      "reviewList"
    );


  review.style.display =
    "block";


  list.innerHTML = "";


  scannedData.forEach(
    (item,index) => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "scanrow";


      row.innerHTML = `

        <b>
          Transaksi ${index+1}
        </b>


        <div class="grid">

          <div>

            <label>
              Nominal
            </label>

            <input
              type="number"
              id="amount_${index}"
              value="${item.amount}"
            >

          </div>


          <div>

            <label>
              Jam mulai
            </label>

            <input
              type="text"
              id="time_${index}"
              value="${item.time}"
              placeholder="12:20"
            >

          </div>


          <div>

            <label>
              Jam selesai
            </label>

            <input
              type="text"
              id="end_${index}"
              value="${item.endTime}"
              placeholder="12:53"
            >

          </div>


          <div>

            <label>
              Jarak (km)
            </label>

            <input
              type="text"
              id="distance_${index}"
              value="${item.distance}"
              placeholder="8.44"
            >

          </div>


          <div>

            <label>
              Pembayaran
            </label>

            <select
              id="payment_${index}"
            >

              <option
                value=""
                ${!item.payment ? "selected":""}
              >
                -
              </option>

              <option
                value="GoPay"
                ${item.payment==="GoPay" ? "selected":""}
              >
                GoPay
              </option>

              <option
                value="Tunai"
                ${item.payment==="Tunai" ? "selected":""}
              >
                Tunai
              </option>

            </select>

          </div>

        </div>

      `;


      list.appendChild(row);

    }
  );


  review.scrollIntoView({
    behavior:"smooth"
  });

}


/* =====================================================
   SAVE SCANNED
===================================================== */

function saveScanned(){

  let saved = 0;


  scannedData.forEach(
    (item,index) => {

      const amount =
        Number(
          document.getElementById(
            "amount_"+index
          ).value
        );


      const time =
        document.getElementById(
          "time_"+index
        ).value.trim();


      const endTime =
        document.getElementById(
          "end_"+index
        ).value.trim();


      const distance =
        document.getElementById(
          "distance_"+index
        ).value.trim();


      const payment =
        document.getElementById(
          "payment_"+index
        ).value;


      if(!amount){

        return;

      }


      /*
        DUPLIKAT:

        tanggal + jam mulai + nominal
      */

      const duplicate =
        transactions.some(
          t =>

          t.source === "gojek" &&

          t.date === item.date &&

          t.time === time &&

          Number(t.amount) === amount
        );


      if(duplicate){

        return;

      }


      transactions.push({

        id:
          Date.now() +
          Math.random(),

        type:"income",

        amount:amount,

        source:"gojek",

        time:time,

        endTime:endTime,

        distance:distance,

        payment:payment,

        date:item.date

      });


      saved++;

    }
  );


  saveData();

  renderTransactions();


  scannedData = [];


  document.getElementById(
    "review"
  ).style.display =
    "none";


  alert(
    "✅ " +
    saved +
    " transaksi berhasil disimpan!"
  );

}


/* =====================================================
   CANCEL
===================================================== */

function cancelScan(){

  scannedData = [];


  document.getElementById(
    "review"
  ).style.display =
    "none";

}


/* =====================================================
   MANUAL TRANSACTION
===================================================== */

function addManual(){

  const type =
    document.getElementById(
      "manualType"
    ).value;


  const amount =
    Number(
      document.getElementById(
        "manualAmount"
      ).value
    );


  const note =
    document.getElementById(
      "manualNote"
    ).value.trim();


  if(!amount){

    alert(
      "Masukkan nominal."
    );

    return;

  }


  transactions.push({

    id:Date.now(),

    type:type,

    amount:amount,

    note:note,

    source:"manual",

    date:getToday()

  });


  saveData();

  renderTransactions();


  document.getElementById(
    "manualAmount"
  ).value = "";


  document.getElementById(
    "manualNote"
  ).value = "";

}


/* =====================================================
   DELETE ALL
===================================================== */

function deleteAll(){

  if(
    !confirm(
      "Yakin mau menghapus SEMUA transaksi?"
    )
  ){

    return;

  }


  transactions = [];


  saveData();

  renderTransactions();

}


/* =====================================================
   START
===================================================== */

renderTransactions();

</script>
