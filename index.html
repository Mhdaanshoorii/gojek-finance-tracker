<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gojek Finance Tracker V6</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f3f5f7;
  font-family:Arial,sans-serif;
  color:#222
}

header{
  background:#008f5a;
  color:#fff;
  padding:22px 18px
}

header h1{
  margin:0;
  font-size:25px
}

header p{
  margin:6px 0 0;
  opacity:.9
}

.container{
  max-width:700px;
  margin:auto;
  padding:16px
}

.card{
  background:#fff;
  border-radius:18px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.07)
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px
}

.stat{
  background:#f7f7f7;
  padding:13px 5px;
  border-radius:12px;
  text-align:center
}

.stat small{
  display:block;
  color:#666;
  font-size:12px
}

.stat strong{
  display:block;
  margin-top:6px;
  font-size:14px
}

.income{color:#087f50}
.expense{color:#d52d3d}

input,select,button{
  width:100%;
  padding:13px;
  margin-top:8px;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:15px
}

button{
  background:#008f5a;
  color:white;
  border:0;
  font-weight:bold
}

button.gray{background:#666}
button.red{background:#dc3545}

#progress{
  margin-top:12px;
  font-size:14px;
  color:#555
}

#review{display:none}

.scanrow{
  border:1px solid #ddd;
  border-radius:13px;
  padding:12px;
  margin-top:10px;
  background:#fafafa
}

.scanrow b{font-size:15px}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}

label{
  display:block;
  margin-top:9px;
  font-size:12px;
  color:#666
}

.scanrow input,
.scanrow select{
  padding:9px
}

.transaction{
  padding:13px 0;
  border-bottom:1px solid #eee
}

.transaction:last-child{
  border-bottom:0
}

.t-title{
  font-size:16px;
  font-weight:bold
}

.t-info{
  font-size:14px;
  margin-top:4px;
  color:#555
}

.t-date{
  font-size:12px;
  margin-top:5px;
  color:#888
}

.empty{
  text-align:center;
  color:#888;
  padding:20px
}

.notice{
  margin-top:10px;
  background:#fff5d6;
  border-radius:10px;
  padding:10px;
  font-size:13px
}

.debug{
  margin-top:12px;
  background:#f4f4f4;
  padding:10px;
  border-radius:10px;
  font-size:11px;
  white-space:pre-wrap;
  max-height:180px;
  overflow:auto;
  color:#555
}
</style>
</head>

<body>

<header>
  <h1>🛵 Gojek Finance Tracker</h1>
  <p>Catat pemasukan & pengeluaran driver</p>
</header>

<div class="container">

<div class="card">
  <div class="stats">

    <div class="stat">
      <small>Pemasukan</small>
      <strong class="income" id="totalIncome">Rp0</strong>
    </div>

    <div class="stat">
      <small>Pengeluaran</small>
      <strong class="expense" id="totalExpense">Rp0</strong>
    </div>

    <div class="stat">
      <small>Bersih</small>
      <strong id="totalNet">Rp0</strong>
    </div>

  </div>
</div>


<div class="card">

  <h2>📸 Scan Screenshot Gojek</h2>

  <p>
    Upload screenshot riwayat perjalanan Gojek.
  </p>

  <input
    type="file"
    id="imageInput"
    accept="image/*"
  >

  <button onclick="scanImage()">
    🔎 Baca Screenshot
  </button>

  <div id="progress"></div>

  <div class="notice">
    💡 Periksa hasil scan sebelum menyimpan.
  </div>

</div>


<div class="card" id="review">

  <h2>🔍 Periksa Hasil Scan</h2>

  <div id="reviewList"></div>

  <button onclick="saveScanned()">
    💾 Simpan Semua
  </button>

  <button class="gray" onclick="cancelScan()">
    Batal
  </button>

  <div id="debugBox"></div>

</div>


<div class="card">

  <h2>➕ Tambah Transaksi</h2>

  <label>Jenis</label>

  <select id="manualType">
    <option value="income">Pemasukan</option>
    <option value="expense">Pengeluaran</option>
  </select>

  <label>Nominal</label>

  <input
    type="number"
    id="manualAmount"
    placeholder="Contoh: 15000"
  >

  <label>Keterangan</label>

  <input
    type="text"
    id="manualNote"
    placeholder="Contoh: Bensin"
  >

  <button onclick="addManual()">
    Simpan Transaksi
  </button>

</div>


<div class="card">

  <h2>🧾 Transaksi</h2>

  <div id="transactions"></div>

  <button class="red" onclick="deleteAll()">
    Hapus Semua Data
  </button>

</div>

</div>


<script>

let transactions =
  JSON.parse(
    localStorage.getItem("gojekTransactions") || "[]"
  );

let scannedData = [];


/* =========================
   RUPIAH
========================= */

function rupiah(n){

  return new Intl.NumberFormat(
    "id-ID",
    {
      style:"currency",
      currency:"IDR",
      maximumFractionDigits:0
    }
  ).format(Number(n));

}


/* =========================
   STORAGE
========================= */

function saveData(){

  localStorage.setItem(
    "gojekTransactions",
    JSON.stringify(transactions)
  );

}


/* =========================
   TANGGAL
========================= */

function getToday(){

  const d = new Date();

  return (
    String(d.getDate()).padStart(2,"0") +
    "/" +
    String(d.getMonth()+1).padStart(2,"0") +
    "/" +
    d.getFullYear()
  );

}


/* =========================
   DASHBOARD
========================= */

function updateDashboard(){

  let income=0;
  let expense=0;

  transactions.forEach(t=>{

    if(t.type==="income")
      income+=Number(t.amount);

    if(t.type==="expense")
      expense+=Number(t.amount);

  });

  document.getElementById("totalIncome")
    .textContent=rupiah(income);

  document.getElementById("totalExpense")
    .textContent=rupiah(expense);

  document.getElementById("totalNet")
    .textContent=rupiah(income-expense);

}


/* =========================
   RENDER
========================= */

function renderTransactions(){

  const box=
    document.getElementById("transactions");

  if(!transactions.length){

    box.innerHTML=
      '<div class="empty">Belum ada transaksi</div>';

    updateDashboard();
    return;

  }

  box.innerHTML="";

  [...transactions].reverse().forEach(t=>{

    const div=
      document.createElement("div");

    div.className="transaction";

    const income=
      t.type==="income";

    const arrow=
      income ? "⬆️" : "⬇️";

    let info="";

    if(t.source==="gojek"){

      let jam=t.time || "-";

      if(t.endTime)
        jam += "–"+t.endTime;

      info=
        "Gojek · "+
        jam+
        " · "+
        (t.distance||"-")+
        " km · "+
        (t.payment||"-");

    }else{

      info=t.note||"Manual";

    }

    div.innerHTML=`

      <div class="t-title ${income?"income":"expense"}">
        ${arrow} ${rupiah(t.amount)}
      </div>

      <div class="t-info">
        ${info}
      </div>

      <div class="t-date">
        ${t.date||"-"}
      </div>

    `;

    box.appendChild(div);

  });

  updateDashboard();

}


/* =========================
   PREPARE IMAGE
========================= */

function prepareImage(file){

  return new Promise((resolve,reject)=>{

    const img=new Image();

    const url=
      URL.createObjectURL(file);

    img.onload=()=>{

      const scale=2;

      const canvas=
        document.createElement("canvas");

      canvas.width=
        img.width*scale;

      canvas.height=
        img.height*scale;

      const ctx=
        canvas.getContext("2d");

      ctx.drawImage(
        img,
        0,
        0,
        canvas.width,
        canvas.height
      );

      const data=
        ctx.getImageData(
          0,
          0,
          canvas.width,
          canvas.height
        );

      for(
        let i=0;
        i<data.data.length;
        i+=4
      ){

        const r=data.data[i];
        const g=data.data[i+1];
        const b=data.data[i+2];

        const gray=
          .299*r+
          .587*g+
          .114*b;

        data.data[i]=gray;
        data.data[i+1]=gray;
        data.data[i+2]=gray;

      }

      ctx.putImageData(data,0,0);

      URL.revokeObjectURL(url);

      resolve(canvas);

    };

    img.onerror=reject;

    img.src=url;

  });

}


/* =========================
   NORMALIZE
========================= */

function cleanText(text){

  return String(text||"")
    .replace(/[“”"]/g,"")
    .replace(/[|]/g,"")
    .replace(/\r/g,"");

}


/* =========================
   AMOUNT
========================= */

function extractAmounts(text){

  const s=
    cleanText(text)
      .replace(/O/gi,"0")
      .replace(/[Il]/g,"1");

  const regex=
    /R[Pp]\s*([0-9][0-9.,]*)/g;

  const result=[];

  let m;

  while((m=regex.exec(s))!==null){

    const digits=
      m[1].replace(/[^\d]/g,"");

    const n=Number(digits);

    if(n>=1000 && n<=1000000){

      result.push(n);

    }

  }

  return result;

}


/* =========================
   TIME
========================= */

function extractAllTimes(text){

  const s=
    cleanText(text)
      .replace(/[Oo]/g,"0")
      .replace(/[Il]/g,"1")
      .replace(/;/g,":");

  const regex=
    /([01]?\d|2[0-3])\s*[:.]\s*([0-5]\d)/g;

  const result=[];

  let m;

  while((m=regex.exec(s))!==null){

    result.push({

      hour:Number(m[1]),

      minute:Number(m[2]),

      value:
        String(Number(m[1])).padStart(2,"0")+
        ":"+
        m[2],

      index:m.index

    });

  }

  return result;

}


/* =========================
   TIME PAIRS
========================= */

function extractTimePairs(text){

  const times=
    extractAllTimes(text);

  const pairs=[];

  for(let i=0;i<times.length-1;i++){

    const a=times[i];
    const b=times[i+1];

    const diff=
      (b.hour*60+b.minute)-
      (a.hour*60+a.minute);

    /*
      Perjalanan normal:
      jam selesai harus setelah jam mulai
      dan durasinya masuk akal.
    */

    if(diff>=1 && diff<=180){

      pairs.push({

        start:a.value,

        end:b.value,

        index:a.index

      });

      i++;

    }

  }

  return pairs;

}


/* =========================
   DISTANCE
========================= */

function extractDistances(text){

  const s=
    cleanText(text)
      .replace(/,/g,".");

  const regex=
    /(\d{1,2}\.\d{1,2})\s*km/gi;

  const result=[];

  let m;

  while((m=regex.exec(s))!==null){

    const n=parseFloat(m[1]);

    if(n>0 && n<100){

      result.push(n.toFixed(2));

    }

  }

  return result;

}


/* =========================
   PAYMENT
========================= */

function extractPayments(text){

  const s=
    cleanText(text).toLowerCase();

  const result=[];

  /*
    Ambil kemunculan GoPay/Tunai
  */

  const regex=
    /gopay|tunai/gi;

  let m;

  while((m=regex.exec(s))!==null){

    result.push(
      m[0].toLowerCase()==="tunai"
      ? "Tunai"
      : "GoPay"
    );

  }

  return result;

}


/* =========================
   BUILD TRANSACTIONS
========================= */

function buildScannedTransactions(rawText){

  const amounts=
    extractAmounts(rawText);

  const pairs=
    extractTimePairs(rawText);

  const distances=
    extractDistances(rawText);

  const payments=
    extractPayments(rawText);


  /*
    Penting:

    Screenshot Gojek dibaca
    dari atas ke bawah.

    Amounts juga urut
    dari atas ke bawah.

    Time pairs juga urut
    dari atas ke bawah.

    Jadi kita pasangkan
    berdasarkan INDEX.
  */


  const result=[];


  amounts.forEach((amount,i)=>{

    const pair=
      pairs[i] || null;

    const distance=
      distances[i] || "";

    const payment=
      payments[i] || "";


    result.push({

      type:"income",

      source:"gojek",

      amount:amount,

      time:
        pair ? pair.start : "",

      endTime:
        pair ? pair.end : "",

      distance:distance,

      payment:payment,

      date:getToday()

    });

  });


  return result;

}


/* =========================
   SCAN IMAGE
========================= */

async function scanImage(){

  const input=
    document.getElementById("imageInput");

  const progress=
    document.getElementById("progress");

  if(
    !input.files ||
    !input.files[0]
  ){

    alert(
      "Pilih screenshot Gojek dulu."
    );

    return;

  }


  try{

    progress.innerHTML=
      "🖼️ Menyiapkan gambar...";


    const canvas=
      await prepareImage(
        input.files[0]
      );


    progress.innerHTML=
      "⏳ OCR sedang membaca...";


    const result=
      await Tesseract.recognize(
        canvas,
        "eng",
        {

          logger:m=>{

            if(
              m.status==="recognizing text"
            ){

              progress.innerHTML=
                "⏳ Membaca "+
                Math.round(
                  m.progress*100
                )+
                "%...";

            }

          }

        }
      );


    const raw=
      result.data.text || "";


    console.log(
      "OCR V6:",
      raw
    );


    scannedData=
      buildScannedTransactions(
        raw
      );


    /*
      Jangan masukkan transaksi
      yang tidak punya nominal.
    */

    scannedData=
      scannedData.filter(
        x=>
          x.amount>=1000 &&
          x.amount<=1000000
      );


    if(!scannedData.length){

      progress.innerHTML=
        "❌ Transaksi tidak ditemukan.";

      alert(
        "Nominal Gojek tidak ditemukan."
      );

      return;

    }


    showReview(raw);


    progress.innerHTML=
      "✅ "+
      scannedData.length+
      " transaksi ditemukan.";

  }
  catch(err){

    console.error(err);

    progress.innerHTML=
      "❌ OCR gagal.";

    alert(
      "OCR gagal membaca screenshot."
    );

  }

}


/* =========================
   REVIEW
========================= */

function showReview(raw){

  const review=
    document.getElementById("review");

  const list=
    document.getElementById("reviewList");

  const debug=
    document.getElementById("debugBox");


  review.style.display="block";

  list.innerHTML="";


  scannedData.forEach((item,index)=>{

    const row=
      document.createElement("div");

    row.className="scanrow";


    row.innerHTML=`

      <b>Transaksi ${index+1}</b>

      <div class="grid">

        <div>

          <label>Nominal</label>

          <input
            type="number"
            id="amount_${index}"
            value="${item.amount}"
          >

        </div>


        <div>

          <label>Jam mulai</label>

          <input
            type="text"
            id="time_${index}"
            value="${item.time}"
            placeholder="12:20"
          >

        </div>


        <div>

          <label>Jam selesai</label>

          <input
            type="text"
            id="end_${index}"
            value="${item.endTime}"
            placeholder="12:53"
          >

        </div>


        <div>

          <label>Jarak (km)</label>

          <input
            type="text"
            id="distance_${index}"
            value="${item.distance}"
            placeholder="8.44"
          >

        </div>


        <div>

          <label>Pembayaran</label>

          <select id="payment_${index}">

            <option
              value=""
              ${!item.payment?"selected":""}
            >
              -
            </option>

            <option
              value="GoPay"
              ${item.payment==="GoPay"?"selected":""}
            >
              GoPay
            </option>

            <option
              value="Tunai"
              ${item.payment==="Tunai"?"selected":""}
            >
              Tunai
            </option>

          </select>

        </div>

      </div>
    `;


    list.appendChild(row);

  });


  /*
    OCR mentah tetap ditampilkan
    untuk debugging.
  */

  debug.innerHTML=
    "<b>OCR mentah:</b><div class='debug'>"+
    escapeHtml(raw)+
    "</div>";


  review.scrollIntoView({
    behavior:"smooth"
  });

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}


/* =========================
   SAVE SCANNED
========================= */

function saveScanned(){

  let saved=0;


  scannedData.forEach((item,index)=>{

    const amount=
      Number(
        document.getElementById(
          "amount_"+index
        ).value
      );


    const time=
      document.getElementById(
        "time_"+index
      ).value.trim();


    const endTime=
      document.getElementById(
        "end_"+index
      ).value.trim();


    const distance=
      document.getElementById(
        "distance_"+index
      ).value.trim();


    const payment=
      document.getElementById(
        "payment_"+index
      ).value;


    if(!amount)
      return;


    /*
      Anti duplikat:

      tanggal
      + jam mulai
      + nominal
    */

    const duplicate=
      transactions.some(t=>
        t.source==="gojek" &&
        t.date===item.date &&
        t.time===time &&
        Number(t.amount)===amount
      );


    if(duplicate)
      return;


    transactions.push({

      id:
        Date.now()+
        Math.random(),

      type:"income",

      source:"gojek",

      amount:amount,

      time:time,

      endTime:endTime,

      distance:distance,

      payment:payment,

      date:item.date

    });


    saved++;

  });


  saveData();

  renderTransactions();


  scannedData=[];


  document.getElementById(
    "review"
  ).style.display="none";


  alert(
    "✅ "+
    saved+
    " transaksi berhasil disimpan!"
  );

}


/* =========================
   CANCEL
========================= */

function cancelScan(){

  scannedData=[];

  document.getElementById(
    "review"
  ).style.display="none";

}


/* =========================
   MANUAL
========================= */

function addManual(){

  const type=
    document.getElementById(
      "manualType"
    ).value;

  const amount=
    Number(
      document.getElementById(
        "manualAmount"
      ).value
    );

  const note=
    document.getElementById(
      "manualNote"
    ).value.trim();


  if(!amount){

    alert(
      "Masukkan nominal."
    );

    return;

  }


  transactions.push({

    id:Date.now(),

    type:type,

    amount:amount,

    note:note,

    source:"manual",

    date:getToday()

  });


  saveData();

  renderTransactions();


  document.getElementById(
    "manualAmount"
  ).value="";


  document.getElementById(
    "manualNote"
  ).value="";

}


/* =========================
   DELETE ALL
========================= */

function deleteAll(){

  if(
    !confirm(
      "Yakin mau menghapus SEMUA transaksi?"
    )
  )
    return;


  transactions=[];

  saveData();

  renderTransactions();

}


/* =========================
   START
========================= */

renderTransactions();

</script>

</body>
</html>
